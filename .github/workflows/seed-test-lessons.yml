name: Migrate Lesson Fields + Seed Test Lessons

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/seed-test-lessons.yml'

permissions:
  contents: read
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Vercel build (2 minutes)
        run: sleep 120

      - name: Apply migration + seed
        id: run
        run: |
          BASE="https://courtside-two-silk.vercel.app"
          RESULTS=""

          for entry in \
            "migrate-lesson-fields|courtside-migrate-lesson-fields-2026-05-15-Mp4xJ8wQzN" \
            "seed-test-lessons|courtside-seed-test-lessons-2026-05-15-Lq7vBnRyKx"
          do
            ROUTE="${entry%%|*}"
            TOKEN="${entry##*|}"
            URL="$BASE/api/admin/$ROUTE?token=$TOKEN"
            echo "--- Calling $ROUTE ---"
            CODE=$(curl -sS -X POST -o /tmp/body.json -w "%{http_code}" "$URL" || echo "failed")
            echo "HTTP $CODE"
            BODY=$(cat /tmp/body.json)
            echo "$BODY"
            RESULTS="$RESULTS"$'\n'"### $ROUTE (HTTP $CODE)"$'\n''```json'$'\n'"$BODY"$'\n''```'$'\n'
          done

          {
            echo "results<<EOF"
            echo "$RESULTS"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Post result as Issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## Lesson Migration + Seed Results\n\n${{ steps.run.outputs.results }}\n\n---\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Migration+Seed] lesson fields + 14 test lessons`,
              body,
              labels: ['migration-result', 'seed-result']
            });
