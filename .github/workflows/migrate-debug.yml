name: Migrate Debug

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/migrate-debug.yml'

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Vercel build (3 minutes)
        run: sleep 180

      - name: Probe deployment endpoints
        run: |
          BASE="https://courtside-two-silk.vercel.app"
          mkdir -p .migration-debug
          OUT=".migration-debug/$(date -u +%Y%m%d-%H%M%S).log"

          {
            echo "=== Deployment Debug $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            echo "Commit: $(git rev-parse HEAD)"
            echo ""

            # 1. 새로 추가된 API 라우트들 확인
            echo "================ API ROUTES ================"
            ENDPOINTS=(
              "GET|/api/admin/migrate-phone-verifications"
              "POST|/api/auth/send-phone-code"
              "POST|/api/auth/verify-phone-code"
            )
            for entry in "${ENDPOINTS[@]}"; do
              METHOD="${entry%%|*}"
              PATH_="${entry##*|}"
              URL="$BASE$PATH_"
              echo ""
              echo "--- $METHOD $PATH_ ---"
              CODE=$(curl -sS -X "$METHOD" -o /tmp/body.txt -w "%{http_code}" "$URL" || echo "curl-failed")
              echo "  HTTP: $CODE"
              echo "  Body (first 300 chars):"
              head -c 300 /tmp/body.txt | sed 's/^/    /'
              echo ""
            done

            echo ""
            echo "================ PAGES ================"
            PAGES=(
              "/onboarding/student"
              "/onboarding/coach/plan"
              "/onboarding/coach/schedule"
            )
            for P in "${PAGES[@]}"; do
              URL="$BASE$P"
              echo ""
              echo "--- GET $P ---"
              CODE=$(curl -sS -o /tmp/body.txt -w "%{http_code}" "$URL" || echo "curl-failed")
              echo "  HTTP: $CODE"
              # AlertModal 컴포넌트 또는 PhoneVerification 단어 검색 (새 빌드 여부 추정)
              echo "  Contains 'courtside-pop-anim': $(grep -c 'courtside-pop-anim' /tmp/body.txt 2>/dev/null || echo 0)"
              echo "  Contains '본인 인증': $(grep -c '본인 인증' /tmp/body.txt 2>/dev/null || echo 0)"
              echo "  Contains 'PhoneVerification': $(grep -c 'PhoneVerification' /tmp/body.txt 2>/dev/null || echo 0)"
            done

            echo ""
            echo "=== End ==="
          } | tee "$OUT"

      - name: Commit results
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "courtside-bot"
          git add .migration-debug/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "debug: deployment probe result"
            git pull --rebase origin main || true
            git push
          fi
