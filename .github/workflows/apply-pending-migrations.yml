name: Apply Pending Migrations

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-pending-migrations.yml'

permissions:
  contents: read
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Vercel build (2 minutes)
        run: sleep 120

      - name: Apply migrations
        id: apply
        run: |
          BASE="https://courtside-two-silk.vercel.app"
          RESULTS=""

          for entry in \
            "migrate-phone-verifications|courtside-phoneverif-2026-05-14-Hk8nP3qLwR" \
            "migrate-terms|courtside-terms-2026-05-14-Rk9wXt7vMpQz"
          do
            ROUTE="${entry%%|*}"
            TOKEN="${entry##*|}"
            URL="$BASE/api/admin/$ROUTE?token=$TOKEN"
            echo "--- Calling $ROUTE ---"
            CODE=$(curl -sS -X POST -o /tmp/body.json -w "%{http_code}" "$URL" || echo "failed")
            echo "HTTP $CODE"
            BODY=$(cat /tmp/body.json)
            echo "$BODY"
            echo ""
            RESULTS="$RESULTS\n### $ROUTE (HTTP $CODE)\n\`\`\`json\n$BODY\n\`\`\`\n"
          done

          echo "results<<EOF" >> $GITHUB_OUTPUT
          echo -e "$RESULTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post result as Issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## Migration Results\n\n${{ steps.apply.outputs.results }}\n\n---\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Migration] phone_verifications + terms`,
              body,
              labels: ['migration-result']
            });
