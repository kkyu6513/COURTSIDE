name: Build Test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-test.yml'

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        id: build
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@placeholder.supabase.co:5432/postgres"
          DIRECT_URL: "postgresql://placeholder:placeholder@placeholder.supabase.co:5432/postgres"
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder"
        run: |
          set +e
          npm run build > build.log 2>&1
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          set -e

      - name: Post build log as GitHub Issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('build.log', 'utf-8');
            const tail = log.split('\n').slice(-200).join('\n');
            const exitCode = '${{ steps.build.outputs.exit_code }}';
            const commit = '${{ github.sha }}'.slice(0, 7);

            const body = `### Build Test Result\n\n- **Commit**: \`${commit}\`\n- **Exit code**: \`${exitCode}\`\n- **Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\n### Last 200 lines of build log\n\n\`\`\`\n${tail}\n\`\`\`\n`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Build Log] ${commit} - exit ${exitCode}`,
              body,
              labels: ['build-debug']
            });
