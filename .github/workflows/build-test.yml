name: Build Test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-test.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        id: build
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@placeholder.supabase.co:5432/postgres"
          DIRECT_URL: "postgresql://placeholder:placeholder@placeholder.supabase.co:5432/postgres"
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder"
        run: |
          set +e
          npm run build > build.log 2>&1
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          set -e
      - name: Commit log
        if: always()
        run: |
          mkdir -p .build-log
          OUT=".build-log/$(date -u +%Y%m%d-%H%M%S).log"
          {
            echo "=== Build Test $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            echo "Commit: $(git rev-parse HEAD)"
            echo "Exit code: ${{ steps.build.outputs.exit_code }}"
            echo ""
            echo "=== Last 300 lines of build log ==="
            tail -300 build.log
          } > "$OUT"

          git config user.email "actions@github.com"
          git config user.name "courtside-bot"
          git add .build-log/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "debug: build log"
            git pull --rebase origin main || true
            git push
          fi
