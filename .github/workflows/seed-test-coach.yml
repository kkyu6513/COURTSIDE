name: Seed Test Coach

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/seed-test-coach.yml'

permissions:
  contents: read
  issues: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Vercel build (2 minutes)
        run: sleep 120

      - name: Call seed-test-coach
        id: seed
        run: |
          URL="https://courtside-two-silk.vercel.app/api/admin/seed-test-coach?token=courtside-seed-test-coach-2026-05-14-Zx9wKpQrT4"
          echo "--- Calling seed-test-coach ---"
          CODE=$(curl -sS -X POST -o /tmp/body.json -w "%{http_code}" "$URL" || echo "failed")
          echo "HTTP $CODE"
          BODY=$(cat /tmp/body.json)
          echo "$BODY"

          {
            echo "result<<EOF"
            echo "### seed-test-coach (HTTP $CODE)"
            echo ""
            echo '```json'
            echo "$BODY"
            echo '```'
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Post result as Issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## Seed Test Coach Result\n\n${{ steps.seed.outputs.result }}\n\n---\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Seed] test-coach 홍길동 / 01012345678`,
              body,
              labels: ['seed-result']
            });
