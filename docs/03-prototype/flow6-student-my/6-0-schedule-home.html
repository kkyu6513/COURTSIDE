<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=375, initial-scale=1.0">

  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="../common-v6.css">
  <style>
    /* 영역 타이틀 한 줄 처리: 타이틀 · 서브타이틀 */
    .v6 .sec-ttl { display: flex; align-items: baseline; gap: 8px; flex-wrap: nowrap; }
    .v6 .sec-ttl .sub { margin-top: 0; }
    .v6 .sec-ttl .sub::before { content: '· '; opacity: 0.6; }

    /* 응답필요 더보기 버튼 */
    .v6 .alerts-more { margin-top: 8px; width: 100%; height: 36px; border: 1px dashed var(--line); background: transparent; color: var(--ink-2); border-radius: 10px; font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer; letter-spacing: -0.1px; }
    .v6 .alerts-more:hover { background: var(--surface); }

    /* compact alert (아이콘/버튼 제거 + 카드 자체 클릭) */
    .v6 .alert.alert-clickable { cursor: pointer; }
    .v6 .alert.alert-clickable:hover { background: var(--surface); }
    .v6 .alert.compact .lead { display: none; }
    .v6 .alert.compact .actions { display: none; }
    .v6 .alert .arrow { flex-shrink: 0; align-self: center; color: var(--ink-3); margin-left: 8px; }
    .v6 .pill.tip-chip { cursor: pointer; user-select: none; }
    .v6 .pill.tip-chip::after { content: ' ⓘ'; opacity: 0.7; font-size: 9px; }
    .v6 .alert .tip-pop { display: none; margin-top: 6px; padding: 8px 10px; background: #1E293B; color: #fff; font-size: 11px; border-radius: 8px; line-height: 1.5; letter-spacing: -0.1px; }
    .v6 .alert .tip-pop.show { display: block; }

    /* 보강 일정 선택 바텀시트 */
    .v6 .ms-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); z-index: 50; display: none; }
    .v6 .ms-overlay.show { display: block; }
    .v6 .ms-sheet { position: absolute; bottom: 0; left: 0; right: 0; background: #fff; border-radius: 20px 20px 0 0; padding: 20px 18px 24px; }
    .v6 .ms-sheet .handle { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 14px; }
    .v6 .ms-sheet h3 { margin: 0 0 6px; font-size: 16px; font-weight: 700; color: var(--ink); letter-spacing: -0.3px; }
    .v6 .ms-sheet .lead { font-size: 12px; color: var(--ink-3); margin-bottom: 14px; letter-spacing: -0.1px; }
    .v6 .ms-sheet .slot { display: flex; align-items: center; padding: 14px 14px; border: 1.5px solid var(--line); border-radius: 12px; margin-bottom: 8px; cursor: pointer; gap: 10px; }
    .v6 .ms-sheet .slot input { width: 18px; height: 18px; accent-color: var(--ink); flex-shrink: 0; margin: 0; }
    .v6 .ms-sheet .slot .txt { font-size: 14px; font-weight: 600; color: var(--ink); }
    .v6 .ms-sheet .slot.selected { border-color: var(--ink); background: var(--soft); }
    .v6 .ms-sheet .submit-row { display: flex; gap: 8px; margin-top: 16px; }
    .v6 .ms-sheet .submit-row button { flex: 1; height: 48px; border-radius: 10px; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; letter-spacing: -0.2px; }
    .v6 .ms-sheet .submit-row .cancel { border: 1px solid var(--line); background: #fff; color: var(--ink); }
    .v6 .ms-sheet .submit-row .submit { border: none; background: var(--ink); color: #fff; flex: 2; }
    .v6 .ms-sheet .submit-row .submit:disabled { background: var(--line); cursor: not-allowed; color: var(--ink-3); }

    /* 공지사항 빈 상태 카드 */
    .v6 .notice-empty { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 14px; display: flex; align-items: center; gap: 12px; }
    .v6 .notice-empty .ava { width: 36px; height: 36px; border-radius: 50%; background: var(--soft); color: var(--ink-2); font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .v6 .notice-empty .b { flex: 1; min-width: 0; }
    .v6 .notice-empty .b .nm { font-size: 13px; font-weight: 700; color: var(--ink); letter-spacing: -0.2px; }
    .v6 .notice-empty .b .ttl { margin-top: 2px; font-size: 13px; font-weight: 600; color: var(--ink-2); letter-spacing: -0.1px; }
    .v6 .notice-empty .b .sub { margin-top: 2px; font-size: 11px; color: var(--ink-3); font-weight: 500; line-height: 1.5; }
    .v6 .notice-empty .icon { font-size: 18px; opacity: 0.6; }
  </style>
</head>

<script>
const DAY_NAMES = ['일','월','화','수','목','금','토'];
const TODAY = new Date();
TODAY.setHours(0,0,0,0);
const STUDENT_LESSON_DAYS = [1, 3];
const LESSON_TIME = '14:00';
const LESSON_DURATION = 20;
const HAS_UNPAID = true;
const UNPAID_AMOUNT = 240000;
const UNPAID_DUE_DAYS = 2;
const QS = new URLSearchParams(location.search);
// 공지: ?notice=empty → 빈 상태
const HAS_NOTICE = QS.get('notice') !== 'empty';
// 응답필요: ?alerts=many → 4건+ 노출 (더보기 검증), 기본 1건
const ALERTS_CASE = QS.get('alerts') === 'many' ? 'many' : 'default';
const ALERTS_VISIBLE_LIMIT = 3; // 정책: 기본 3건까지 노출, 초과 시 +N 더보기
const SESSION_DONE = 3;
const SESSION_TOTAL = 8;
const MOCK_NOW_MIN = 9*60 + 41;
const QUOTES = [
  { t: '최고의 샷은 다음 샷이다.', by: '— Tennis Wisdom' },
  { t: '이길 때보다 질 때 더 많이 배운다.', by: '— Billie Jean King' },
  { t: '챔피언은 코트가 아니라 연습장에서 만들어진다.', by: '— Andre Agassi' },
  { t: '실력은 매일의 1%가 1년 뒤 37배가 된다.', by: '— 1% Rule' },
  { t: '느린 진보가 정체보다 낫다.', by: '— Anonymous' },
  { t: '오늘의 한 발이 내일의 폼이 된다.', by: '— Anonymous' },
  { t: '포기하지 않는 한 슬럼프란 없다.', by: '— Roger Federer (paraphrased)' },
  { t: '폼은 일시적이지만, 클래스는 영원하다.', by: '— Football Adage' },
  { t: '연습이 완벽을 만드는 게 아니라, 완벽한 연습이 완벽을 만든다.', by: '— Vince Lombardi' }
];

function addDays(d,n){const x=new Date(d);x.setDate(d.getDate()+n);return x;}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}

function getNextLesson(){
  for(let i=0;i<14;i++){const d=new Date(TODAY);d.setDate(TODAY.getDate()+i);if(STUDENT_LESSON_DAYS.includes(d.getDay()))return d;}
  return null;
}

function timeGreeting(){
  // 실시간 현재 시각 기준
  const h=new Date().getHours();
  if(h<5) return '편안한 밤이에요';
  if(h<11) return '좋은 아침이에요';
  if(h<14) return '좋은 점심이에요';
  if(h<17) return '좋은 오후예요';
  if(h<21) return '좋은 저녁이에요';
  return '편안한 밤이에요';
}

function todayQuote(){
  return QUOTES[Math.floor(Math.random() * QUOTES.length)];
}

function maskNickname(name){
  if(!name) return '';
  if(name.length===1) return name;
  if(name.length===2) return name[0]+'*';
  if(name.length===3) return name[0]+'*'+name[2];
  return name[0]+'*'.repeat(name.length-2)+name[name.length-1];
}

function renderHeader(){
  const m=TODAY.getMonth()+1,dd=TODAY.getDate(),dow=DAY_NAMES[TODAY.getDay()];
  document.getElementById('hdr-greet').textContent=`${maskNickname('홍길동')}님, ${timeGreeting()}`;
  document.getElementById('hdr-date').textContent=`${m}월 ${dd}일 (${dow})`;
  const q=todayQuote();
  document.getElementById('hdr-quote').innerHTML=`"${q.t}"<span class="by">${q.by}</span>`;
}

function renderPayment(){
  const wrap=document.getElementById('payment-wrap');
  const area=document.getElementById('payment-area');
  if(!HAS_UNPAID){wrap.style.display='none';area.innerHTML='';return;}
  wrap.style.display='block';
  const amount=UNPAID_AMOUNT.toLocaleString('ko-KR');
  const overdue=UNPAID_DUE_DAYS<0;
  const pill=overdue
    ? `<span class="pill alert">${Math.abs(UNPAID_DUE_DAYS)}일 연체</span>`
    : (UNPAID_DUE_DAYS<=1 ? `<span class="pill alert">D-${UNPAID_DUE_DAYS}</span>` : `<span class="pill">D-${UNPAID_DUE_DAYS}</span>`);
  area.innerHTML=`
    <a href="6-6-booking-detail.html?status=confirmed&payment=unpaid" class="hero">
      <div class="lead"><svg class="ic"><use href="#i-card"/></svg></div>
      <div class="body">
        <div class="display">${amount}원 ${pill}</div>
        <div class="meta">5월 4주차 레슨료</div>
      </div>
      <svg class="ic ic-sm arrow"><use href="#i-arrow"/></svg>
    </a>`;
}

function renderNextLesson(){
  const area=document.getElementById('next-lesson-area');
  const next=getNextLesson();
  if(!next){
    area.innerHTML=`
      <div class="hero">
        <div class="lead"><svg class="ic"><use href="#i-cal"/></svg></div>
        <div class="body">
          <div class="display" style="color:var(--ink-3);">예정된 레슨 없음</div>
        </div>
      </div>`;
    return;
  }
  const isToday=sameDay(next,TODAY);
  const dow=next.getDay();
  const dayLabel=isToday?'오늘':(sameDay(next,addDays(TODAY,1))?'내일':`${next.getMonth()+1}/${next.getDate()} (${DAY_NAMES[dow]})`);
  const daysDiff=Math.round((next-TODAY)/86400000);
  const [lh,lm]=LESSON_TIME.split(':').map(Number);
  const lessonStartMin=lh*60+lm;
  const lessonEndMin=lessonStartMin+LESSON_DURATION;
  let pill='',meta='김민수 코치';
  if(isToday){
    if(MOCK_NOW_MIN>=lessonStartMin&&MOCK_NOW_MIN<=lessonEndMin){
      pill=`<span class="pill alert">진행 중</span>`;
    }else if(MOCK_NOW_MIN<lessonStartMin){
      const remain=lessonStartMin-MOCK_NOW_MIN;
      const rh=Math.floor(remain/60),rm=remain%60;
      const txt=rh>0?`${rh}시간 ${rm}분 후`:`${rm}분 후`;
      meta=`김민수 코치 · ${txt} 시작`;
      pill=remain<=60?`<span class="pill alert">곧 시작</span>`:`<span class="pill">오늘</span>`;
    }
  }else{
    pill=`<span class="pill">D-${daysDiff}</span>`;
  }
  area.innerHTML=`
    <a href="6-6-booking-detail.html?status=confirmed" class="hero">
      <div class="lead"><svg class="ic"><use href="#i-cal"/></svg></div>
      <div class="body">
        <div class="display">${dayLabel} ${LESSON_TIME} ${pill}</div>
        <div class="meta">${meta}</div>
        <div class="session">${SESSION_DONE} / ${SESSION_TOTAL}회</div>
      </div>
      <svg class="ic ic-sm arrow"><use href="#i-arrow"/></svg>
    </a>`;
}

function renderEmptyHero(){
  const wrap=document.getElementById('empty-wrap');
  const next=getNextLesson();
  wrap.style.display=(!next)?'block':'none';
  document.getElementById('next-wrap').style.display=(!next)?'none':'block';
}

// 보강 일정 제안 — 코치가 제안한 슬롯 + 마감 절대 시각 (실시간 카운팅)
const MAKEUP_SLOTS = ['4/24 (목) 16:00', '4/25 (금) 10:00'];
const MAKEUP_DEADLINE_AT = Date.now() + (8*60*60*1000) + (32*60*1000); // 지금부터 8h 32m 후

// 응답필요 항목 정의
//  - compact:true → 보강 변형 (아이콘/버튼 없음, 카드 클릭으로 바텀시트)
//  - icon: SVG symbol id  (i-sync 일정류, i-star 리뷰, i-pkg 패키지)
//  - deadlineMin: 마감까지 남은 분 (정렬 기준, 임박순 오름차순)
//  - urgent: deadlineMin <= 12h 이면 알림(빨강) 필 사용
const MAKEUP_ALERT = {
  type: 'makeup',
  compact: true,
  title: '보강 일정 제안',
  summary: `${MAKEUP_SLOTS.length}건 제안 · 1개 선택 필요`,
  deadlineAt: MAKEUP_DEADLINE_AT,
  deadlineMin: 8*60+32
};
const MOCK_ALERTS_DEFAULT = [ MAKEUP_ALERT ];
const MOCK_ALERTS_MANY = [
  MAKEUP_ALERT,
  {
    icon: 'i-sync',
    title: '일정 변경 슬롯 제안',
    sub: '4/22 (월) 14:00, 4/22 (월) 16:00 중 1개 선택',
    deadlineMin: 22*60+10,
    deadlineLabel: '22h 10m',

let alertsExpanded = false;
let countdownTimer = null;

function formatRemaining(deadlineAt){
  const ms = Math.max(0, deadlineAt - Date.now());
  if(ms === 0) return '마감';
  const total = Math.floor(ms/1000);
  const h = Math.floor(total/3600);
  const m = Math.floor((total%3600)/60);
  const s = total%60;
  const pad = n => String(n).padStart(2,'0');
  if(h>0) return `${h}시간 ${pad(m)}분 ${pad(s)}초`;
  if(m>0) return `${m}분 ${pad(s)}초`;
  return `${s}초`;
}

function formatDeadlineAbsolute(deadlineAt){
  const d = new Date(deadlineAt);
  const m = d.getMonth()+1, dd = d.getDate(), dow = DAY_NAMES[d.getDay()];
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  return `마감: ${m}/${dd} (${dow}) ${hh}:${mm}<br>응답이 없으면 제안이 자동 만료됩니다.`;
}

function renderAlerts(){
  const wrap = document.getElementById('alerts-wrap');
  const area = document.getElementById('alerts-area');
  const all = (ALERTS_CASE==='many' ? MOCK_ALERTS_MANY : MOCK_ALERTS_DEFAULT)
    .slice().sort((a,b)=>a.deadlineMin-b.deadlineMin);
  if(all.length===0){ wrap.style.display='none'; area.innerHTML=''; return; }
  wrap.style.display='block';
  const visible = alertsExpanded ? all : all.slice(0, ALERTS_VISIBLE_LIMIT);
  const hidden = all.length - visible.length;
  const cards = visible.map(a => {
    if(a.compact && a.type === 'makeup'){
      const urgent = (a.deadlineAt - Date.now()) <= 12*60*60*1000;
      return `
        <div class="alert compact alert-clickable" onclick="openMakeupSheet()">
          <div class="b">
            <div class="head">
              <div class="ttl">${a.title}</div>
              <span class="pill tip-chip ${urgent?'alert':''}" id="makeup-pill" onclick="toggleMakeupTip(event)">${formatRemaining(a.deadlineAt)}</span>
            </div>
            <div class="sub">${a.summary}</div>
            <div class="tip-pop" id="makeup-tip" onclick="event.stopPropagation()">${formatDeadlineAbsolute(a.deadlineAt)}</div>
          </div>
          <svg class="ic ic-sm arrow"><use href="#i-arrow"/></svg>
        </div>`;
    }
    const urgent = a.deadlineMin <= 12*60;
    const pill = a.deadlineLabel ? `<span class="pill ${urgent?'alert':''}">${a.deadlineLabel}</span>` : '';
    const primary = a.primary ? `<a href="${a.primary.href}" class="alert-cta primary">${a.primary.label}</a>` : '';
    const ghost   = a.ghost   ? `<a href="${a.ghost.href}"   class="alert-cta ghost">${a.ghost.label}</a>`   : '';
    return `
      <div class="alert">
        <div class="lead"><svg class="ic ic-sm"><use href="#${a.icon}"/></svg></div>
        <div class="b">
          <div class="head"><div class="ttl">${a.title}</div>${pill}</div>
          <div class="sub">${a.sub}</div>
          <div class="actions">${primary}${ghost}</div>
        </div>
      </div>`;
  }).join('');
  const more = hidden>0 ? `<button type="button" class="alerts-more" onclick="expandAlerts()">+ ${hidden}건 더 있어요</button>` : '';
  area.innerHTML = cards + more;
  startMakeupCountdown();
}

function startMakeupCountdown(){
  if(countdownTimer) clearInterval(countdownTimer);
  const pill = document.getElementById('makeup-pill');
  if(!pill) return;
  countdownTimer = setInterval(() => {
    const el = document.getElementById('makeup-pill');
    if(!el){ clearInterval(countdownTimer); return; }
    el.textContent = formatRemaining(MAKEUP_DEADLINE_AT);
    el.classList.toggle('alert', (MAKEUP_DEADLINE_AT - Date.now()) <= 12*60*60*1000);
  }, 1000);
}

function expandAlerts(){ alertsExpanded = true; renderAlerts(); }

function toggleMakeupTip(e){
  e.stopPropagation();
  const tip = document.getElementById('makeup-tip');
  if(tip) tip.classList.toggle('show');
}

let makeupSelectedSlot = null;

function openMakeupSheet(){
  makeupSelectedSlot = null;
  const slotsEl = document.getElementById('makeup-slots');
  slotsEl.innerHTML = MAKEUP_SLOTS.map((s,i) => `
    <label class="slot" onclick="selectMakeupSlot(${i})">
      <input type="radio" name="makeup-slot" value="${s}" id="ms-slot-${i}">
      <span class="txt">${s}</span>
    </label>
  `).join('');
  document.getElementById('makeup-confirm').disabled = true;
  document.getElementById('makeup-sheet').classList.add('show');
}

function selectMakeupSlot(i){
  makeupSelectedSlot = MAKEUP_SLOTS[i];
  document.querySelectorAll('.ms-sheet .slot').forEach((el, idx) => {
    el.classList.toggle('selected', idx === i);
    const input = el.querySelector('input');
    if(input) input.checked = (idx === i);
  });
  document.getElementById('makeup-confirm').disabled = false;
}

function closeMakeupSheet(event){
  if(event && event.target !== event.currentTarget) return;
  document.getElementById('makeup-sheet').classList.remove('show');
}

function confirmMakeup(){
  if(!makeupSelectedSlot) return;
  alert(`보강 일정 확정\n${makeupSelectedSlot}`);
  closeMakeupSheet();
}

function applyFirstSecTtl(){
  document.querySelectorAll('.sec-ttl').forEach(el=>el.classList.remove('first'));
  const wraps=['empty-wrap','notice-wrap','alerts-wrap','next-wrap','payment-wrap'];
  for(const id of wraps){
    const el=document.getElementById(id);
    if(el && getComputedStyle(el).display!=='none'){
      const t=el.querySelector('.sec-ttl');
      if(t) t.classList.add('first');
      break;
    }
  }
}
