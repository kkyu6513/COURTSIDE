<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=375, initial-scale=1.0">
  <title>6-0 학생 스케줄 홈 — COURTSIDE</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="../common-v6.css">
</head>
<body>
<div class="device-wrap">
  <div class="device-label"><span class="device-num">6-0</span>학생 스케줄 홈 (정보 다이어트)</div>
  <div class="device v6" style="position:relative;overflow:hidden;background:var(--bg);">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18"/><path d="M8 2.5v4M16 2.5v4"/></symbol>
        <symbol id="i-card" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/><path d="M7 15h4"/></symbol>
        <symbol id="i-ball" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3.5 12c4 -2.5 13 -2.5 17 0"/><path d="M3.5 12c4 2.5 13 2.5 17 0"/></symbol>
        <symbol id="i-sync" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.5-5.7"/><path d="M20 12a8 8 0 0 1-13.5 5.7"/><path d="M14 4l4 2-2 4"/><path d="M10 20l-4-2 2-4"/></symbol>
        <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
        <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
        <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-7h-6v7H5a1 1 0 0 1-1-1z"/></symbol>
        <symbol id="i-list" viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h14"/></symbol>
        <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
      </defs>
    </svg>

    <div class="status-bar"><span class="time">9:41</span><div class="status-icons"><span>●</span><span>●</span></div></div>
    <div class="screen" style="padding-bottom:84px;overflow-y:auto;">

      <!-- 헤더: 시간대 인사 + 날짜 + 명언 -->
      <div class="hdr">
        <div class="greet" id="hdr-greet"></div>
        <div class="date" id="hdr-date"></div>
        <div class="quote" id="hdr-quote"></div>
      </div>

      <!-- 카드 영역 (4개 이하) -->
      <div style="padding: 16px 16px 0;">

        <!-- empty (위 모두 비었을 때만) -->
        <div id="empty-wrap" style="display:none;">
          <div class="sec-ttl first">
            <div class="t">안내</div>
            <div class="sub">오늘 시작해보세요</div>
          </div>
          <a href="../flow2-home/2-2-coach-list.html" class="hero">
            <div class="lead"><svg class="ic"><use href="#i-ball"/></svg></div>
            <div class="body">
              <div class="display">예정된 레슨 없음</div>
              <div class="meta">코치를 찾아보세요</div>
            </div>
            <svg class="ic ic-sm arrow"><use href="#i-arrow"/></svg>
          </a>
        </div>

        <!-- 1) 결제 (조건부) -->
        <div id="payment-wrap" style="display:none;">
          <div class="sec-ttl first">
            <div class="t">결제</div>
            <div class="sub">이번 주 레슨료 정산</div>
          </div>
          <div id="payment-area"></div>
        </div>

        <!-- 2) 다음 레슨 -->
        <div id="next-wrap">
          <div class="sec-ttl">
            <div class="t">다음 레슨</div>
            <div class="sub">예정된 정기 레슨</div>
          </div>
          <div id="next-lesson-area"></div>
        </div>

        <!-- 3) 응답 필요 — urgent 1건만 -->
        <div id="alerts-wrap">
          <div class="sec-ttl">
            <div class="t">응답 필요</div>
            <div class="sub">코치가 보낸 제안</div>
          </div>
          <div id="alerts-area">
            <div class="alert">
              <div class="lead"><svg class="ic ic-sm"><use href="#i-sync"/></svg></div>
              <div class="b">
                <div class="head">
                  <div class="ttl">보강 일정 제안</div>
                  <span class="pill alert">8h 32m</span>
                </div>
                <div class="sub">4/24 (목) 16:00, 4/25 (금) 10:00 중 1개 선택</div>
                <div class="actions">
                  <a href="6-6-booking-detail.html?status=makeup_proposed&dates=4%2F24%20(%EB%AA%A9)%2016%3A00%7C4%2F25%20(%EA%B8%88)%2010%3A00#select" class="alert-cta primary">날짜 선택</a>
                  <a href="6-6-booking-detail.html?status=makeup_proposed&dates=4%2F24%20(%EB%AA%A9)%2016%3A00%7C4%2F25%20(%EA%B8%88)%2010%3A00" class="alert-cta ghost">자세히</a>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 4) 코치 공지사항 -->
        <div id="notice-wrap">
          <div class="sec-ttl">
            <div class="t">코치 공지사항</div>
            <div class="sub">코치가 남긴 안내</div>
          </div>
          <div class="notice">
            <div class="head">
              <div class="ava">김</div>
              <div class="who">
                <div class="nm">김민수 코치</div>
                <div class="ts">3시간 전</div>
              </div>
            </div>
            <div class="body">
              이번 주 토요일(<strong>5/10</strong>) 코트 정기 점검으로 모든 레슨이 일요일로 이동됩니다. 시간은 그대로 유지되니 양해 부탁드려요.
            </div>
            <a href="../flow4-chat/4-2-chat.html" class="more">자세히 보기</a>
          </div>
        </div>

      </div>
    </div>

    <div class="navbar">
      <a href="6-0-schedule-home.html" class="active"><svg class="ic"><use href="#i-home"/></svg><span class="lbl">홈</span></a>
      <a href="6-5-booking-list.html"><svg class="ic"><use href="#i-list"/></svg><span class="lbl">내 레슨</span></a>
      <a href="../flow4-chat/4-1-chat-list.html"><svg class="ic"><use href="#i-chat"/></svg><span class="lbl">메시지</span></a>
      <a href="6-2-mypage.html"><svg class="ic"><use href="#i-user"/></svg><span class="lbl">마이</span></a>
    </div>

  </div>
</div>

<script>
const DAY_NAMES = ['일','월','화','수','목','금','토'];
const TODAY = new Date();
TODAY.setHours(0,0,0,0);
const STUDENT_LESSON_DAYS = [1, 3];      // 월·수
const LESSON_TIME = '14:00';
const LESSON_DURATION = 20;
const HAS_UNPAID = true;
const UNPAID_AMOUNT = 240000;
const UNPAID_DUE_DAYS = 2;
const SESSION_DONE = 3;
const SESSION_TOTAL = 8;
// 프로토타입용 mock 현재 시각 (status bar 9:41과 일치)
const MOCK_NOW_MIN = 9*60 + 41;
// 명언 풀 — 테니스/성장 메시지
const QUOTES = [
  { t: '최고의 샷은 다음 샷이다.', by: '— Tennis Wisdom' },
  { t: '이길 때보다 질 때 더 많이 배운다.', by: '— Billie Jean King' },
  { t: '챔피언은 코트가 아니라 연습장에서 만들어진다.', by: '— Andre Agassi' },
  { t: '실력은 매일의 1%가 1년 뒤 37배가 된다.', by: '— 1% Rule' },
  { t: '느린 진보가 정체보다 낫다.', by: '— Anonymous' },
  { t: '오늘의 한 발이 내일의 폼이 된다.', by: '— Anonymous' },
  { t: '포기하지 않는 한 슬럼프란 없다.', by: '— Roger Federer (paraphrased)' },
  { t: '폼은 일시적이지만, 클래스는 영원하다.', by: '— Football Adage' },
  { t: '연습이 완벽을 만드는 게 아니라, 완벽한 연습이 완벽을 만든다.', by: '— Vince Lombardi' }
];

function addDays(d,n){const x=new Date(d);x.setDate(d.getDate()+n);return x;}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}

function getNextLesson(){
  for(let i=0;i<14;i++){const d=new Date(TODAY);d.setDate(TODAY.getDate()+i);if(STUDENT_LESSON_DAYS.includes(d.getDay()))return d;}
  return null;
}

function timeGreeting(){
  const h=Math.floor(MOCK_NOW_MIN/60);
  if(h<5) return '편안한 밤이에요';
  if(h<11) return '좋은 아침이에요';
  if(h<14) return '좋은 점심이에요';
  if(h<17) return '좋은 오후예요';
  if(h<21) return '좋은 저녁이에요';
  return '편안한 밤이에요';
}

function todayQuote(){
  // 날짜 기반 결정적 선택 — 같은 날에는 같은 명언
  const seed=TODAY.getFullYear()*1000 + TODAY.getMonth()*40 + TODAY.getDate();
  return QUOTES[seed % QUOTES.length];
}

function renderHeader(){
  const m=TODAY.getMonth()+1,dd=TODAY.getDate(),dow=DAY_NAMES[TODAY.getDay()];
  document.getElementById('hdr-greet').textContent=timeGreeting();
  document.getElementById('hdr-date').textContent=`${m}월 ${dd}일 (${dow})`;
  const q=todayQuote();
  document.getElementById('hdr-quote').innerHTML=`"${q.t}"<span class="by">${q.by}</span>`;
}

function renderPayment(){
  const wrap=document.getElementById('payment-wrap');
  const area=document.getElementById('payment-area');
  if(!HAS_UNPAID){wrap.style.display='none';area.innerHTML='';return;}
  wrap.style.display='block';
  const amount=UNPAID_AMOUNT.toLocaleString('ko-KR');
  const overdue=UNPAID_DUE_DAYS<0;
  // C8: meta 단축 → "5월 4주차" 1단어 (마감/사유는 pill로)
  const pill=overdue
    ? `<span class="pill alert">${Math.abs(UNPAID_DUE_DAYS)}일 연체</span>`
    : (UNPAID_DUE_DAYS<=1 ? `<span class="pill alert">D-${UNPAID_DUE_DAYS}</span>` : `<span class="pill">D-${UNPAID_DUE_DAYS}</span>`);
  area.innerHTML=`
    <a href="6-6-booking-detail.html?status=confirmed&payment=unpaid" class="hero">
      <div class="lead"><svg class="ic"><use href="#i-card"/></svg></div>
      <div class="body">
        <div class="display">${amount}원 ${pill}</div>
        <div class="meta">5월 4주차 레슨료</div>
      </div>
      <svg class="ic ic-sm arrow"><use href="#i-arrow"/></svg>
    </a>`;
}

function renderNextLesson(){
  const area=document.getElementById('next-lesson-area');
  const next=getNextLesson();
  if(!next){
    area.innerHTML=`
      <div class="hero">
        <div class="lead"><svg class="ic"><use href="#i-cal"/></svg></div>
        <div class="body">
          <div class="display" style="color:var(--ink-3);">예정된 레슨 없음</div>
        </div>
      </div>`;
    return;
  }
  const isToday=sameDay(next,TODAY);
  const dow=next.getDay();
  const dayLabel=isToday?'오늘':(sameDay(next,addDays(TODAY,1))?'내일':`${next.getMonth()+1}/${next.getDate()} (${DAY_NAMES[dow]})`);
  const daysDiff=Math.round((next-TODAY)/86400000);
  const [lh,lm]=LESSON_TIME.split(':').map(Number);
  const lessonStartMin=lh*60+lm;
  const lessonEndMin=lessonStartMin+LESSON_DURATION;
  let pill='',meta='김민수 코치';
  if(isToday){
    if(MOCK_NOW_MIN>=lessonStartMin&&MOCK_NOW_MIN<=lessonEndMin){
      pill=`<span class="pill alert">진행 중</span>`;
    }else if(MOCK_NOW_MIN<lessonStartMin){
      const remain=lessonStartMin-MOCK_NOW_MIN;
      const rh=Math.floor(remain/60),rm=remain%60;
      const txt=rh>0?`${rh}시간 ${rm}분 후`:`${rm}분 후`;
      meta=`김민수 코치 · ${txt} 시작`;
      pill=remain<=60?`<span class="pill alert">곧 시작</span>`:`<span class="pill">오늘</span>`;
    }
  }else{
    pill=`<span class="pill">D-${daysDiff}</span>`;
  }
  // C2·C3: meta 단순화 (코치명 + 임박 시간), progress bar 제거 → 우측 small text
  area.innerHTML=`
    <a href="6-6-booking-detail.html?status=confirmed" class="hero">
      <div class="lead"><svg class="ic"><use href="#i-cal"/></svg></div>
      <div class="body">
        <div class="display">${dayLabel} ${LESSON_TIME} ${pill}</div>
        <div class="meta">${meta}</div>
        <div class="session">${SESSION_DONE} / ${SESSION_TOTAL}회</div>
      </div>
      <svg class="ic ic-sm arrow"><use href="#i-arrow"/></svg>
    </a>`;
}

function renderEmptyHero(){
  const wrap=document.getElementById('empty-wrap');
  const next=getNextLesson();
  const noAlerts=document.querySelectorAll('#alerts-area .alert').length===0;
  // empty hero는 다음 레슨 카드를 대체. 결제·알림과 무관하게 다음 레슨 없을 때 노출.
  wrap.style.display=(!next)?'block':'none';
  // empty가 보이면 next-wrap은 숨김 (다음 레슨 자리를 안내가 차지)
  document.getElementById('next-wrap').style.display=(!next)?'none':'block';
}

function renderAlerts(){
  const cnt=document.querySelectorAll('#alerts-area .alert').length;
  document.getElementById('alerts-wrap').style.display=cnt>0?'block':'none';
}

function applyFirstSecTtl(){
  // 첫 번째로 노출되는 wrap의 sec-ttl에 .first 적용 (헤더 바로 아래 호흡)
  document.querySelectorAll('.sec-ttl').forEach(el=>el.classList.remove('first'));
  const wraps=['empty-wrap','payment-wrap','next-wrap','alerts-wrap'];
  for(const id of wraps){
    const el=document.getElementById(id);
    if(el && getComputedStyle(el).display!=='none'){
      const t=el.querySelector('.sec-ttl');
      if(t) t.classList.add('first');
      break;
    }
  }
}

renderHeader();
renderPayment();
renderNextLesson();
renderAlerts();
renderEmptyHero();
applyFirstSecTtl();
</script>
</body>
</html>
