<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=375, initial-scale=1.0">
  <title>6-0 학생 스케줄 홈 — COURTSIDE</title>
  <link rel="stylesheet" href="../common.css">
  <style>
    /* 큰 hero 카드 (다음 레슨, 결제 안내) */
    .hero-card {background:#fff;border-radius:14px;padding:16px;margin-bottom:8px;border:1px solid var(--gray-100);display:flex;align-items:center;gap:14px;text-decoration:none;border-left:4px solid var(--gray-200);}
    .hero-card.payment {border-left-color:#F59E0B;}
    .hero-card.next-lesson {border-left-color:var(--green);}
    .hero-card .lead-icon {font-size:24px;flex-shrink:0;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--gray-50);border-radius:12px;}
    .hero-card .body {flex:1;min-width:0;}
    .hero-card .label {font-size:10px;color:var(--gray-400);font-weight:700;letter-spacing:0.4px;text-transform:uppercase;margin-bottom:4px;}
    .hero-card .ttl {font-size:16px;font-weight:800;color:var(--navy);margin-bottom:2px;}
    .hero-card .sub {font-size:12px;color:var(--gray-500);line-height:1.5;}
    .hero-card .arrow {color:var(--gray-400);font-size:16px;flex-shrink:0;}
    /* 작은 레슨 카드 (캘린더 선택일 레슨) */
    .lesson-card {background:#fff;border:1px solid var(--gray-100);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:12px;text-decoration:none;}
    .lesson-time {flex-shrink:0;width:50px;text-align:center;}
    .lesson-time .hh {font-size:16px;font-weight:800;color:var(--navy);}
    .lesson-time .ampm {font-size:10px;color:var(--gray-400);font-weight:600;}
    .lesson-info {flex:1;}
    .lesson-info .title {font-size:13px;font-weight:700;color:var(--navy);margin-bottom:2px;}
    .lesson-info .meta {font-size:11px;color:var(--gray-400);}
    .badge-sm {display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;}
    .b-scheduled {background:#EDE9FE;color:#5B21B6;}
    .b-progress  {background:#FEE2E2;color:#B91C1C;}
    .b-completed {background:#DBEAFE;color:#1E40AF;}
    .b-absent    {background:var(--gray-100);color:var(--gray-500);}
    .b-makeup    {background:#D1FAE5;color:#065F46;}
    /* 응답 알림 카드 */
    .alert-card {background:#fff;border:1px solid var(--gray-100);border-left:4px solid #C4B5FD;border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px;text-decoration:none;}
    .alert-card.urgent {border-left-color:var(--coral);}
    .alert-card .icon {font-size:18px;flex-shrink:0;}
    .alert-card .body {flex:1;}
    .alert-card .ttl {font-size:13px;font-weight:700;color:var(--navy);margin-bottom:2px;}
    .alert-card .sub {font-size:11px;color:var(--gray-500);line-height:1.5;}
    .alert-card .arrow {color:var(--gray-400);font-size:14px;flex-shrink:0;align-self:center;}
    /* 보조 코치 카드 (헤더 인사 옆/단순) */
    .coach-pill {display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border:1px solid var(--gray-100);border-radius:12px;text-decoration:none;}
    .coach-pill .ava {width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--sky));display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
    .coach-pill .nm {flex:1;font-size:12px;color:var(--navy);font-weight:600;}
    .coach-pill .nm .role {font-size:10px;color:var(--gray-400);font-weight:500;display:block;margin-bottom:1px;}
    .cal-cell {display:flex;flex-direction:column;align-items:center;justify-content:center;height:46px;border-radius:10px;border:1px solid transparent;cursor:pointer;background:#fff;transition:all 0.15s;}
    .cal-cell:hover {background:var(--gray-50);}
    .cal-cell.has-lesson {border-color:#EDE9FE;background:#F5F3FF;}
    .cal-cell.today {background:var(--green);color:#fff;border-color:var(--green);}
    .cal-cell.today .dow,.cal-cell.today .num {color:#fff;}
    .cal-cell.selected {background:#fff;border-color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset;}
    .cal-cell.selected.has-lesson {background:#F5F3FF;border-color:var(--navy);}
    .cal-cell.today.selected {background:var(--green);border-color:var(--navy);box-shadow:0 0 0 2px var(--navy);}
    .cal-cell .dow {font-size:9px;color:var(--gray-400);font-weight:600;}
    .cal-cell .num {font-size:14px;font-weight:700;color:var(--navy);margin-top:2px;}
    .cal-cell .dot {width:4px;height:4px;border-radius:50%;background:var(--green);margin-top:3px;}
    .cal-cell.today .dot {background:#fff;}
    .section-title {font-size:13px;font-weight:700;color:var(--navy);margin:14px 4px 8px;display:flex;align-items:center;justify-content:space-between;}
  </style>
</head>
<body>
<div class="device-wrap">
  <div class="device-label"><span class="device-num">6-0</span>학생 스케줄 홈 (SaaS 신규)</div>
  <div class="device" style="position:relative;overflow:hidden;background:var(--gray-50);">
    <div class="status-bar"><span class="time">9:41</span><div class="status-icons"><span>📶</span><span>🔋</span></div></div>
    <div class="screen" style="padding-bottom:100px;overflow-y:auto;">

      <!-- 헤더 (단순 인사, 알림 종 제거 — 응답 대기 알림은 화면 안 카드로 통일) -->
      <div style="padding:18px 20px 14px;background:#fff;">
        <div style="font-size:18px;font-weight:800;color:var(--navy);">안녕하세요, 홍길동님 🎾</div>
        <div style="font-size:12px;color:var(--gray-500);margin-top:4px;">오늘도 즐거운 레슨 되세요</div>
      </div>

      <!-- ① 결제 안내 (조건부, 가장 위) -->
      <div id="payment-area" style="padding:0 16px 0;"></div>

      <!-- ② 다음 레슨 (자동 계산, 가장 핵심 정보) -->
      <div style="padding:8px 16px 0;">
        <div id="next-lesson-area"></div>
      </div>

      <!-- ③ 응답 대기 알림 (조건부) -->
      <div id="alerts-wrap" style="padding:8px 16px 0;">
        <div class="section-title">📬 응답 대기 <span style="font-size:11px;color:var(--gray-400);font-weight:500;" id="alert-count"></span></div>
        <div id="alerts-area">
          <a href="6-6-booking-detail.html?status=makeup_proposed&dates=4%2F24%20(%EB%AA%A9)%2016%3A00%7C4%2F25%20(%EA%B8%88)%2010%3A00" class="alert-card urgent">
            <span class="icon">🔄</span>
            <div class="body">
              <div class="ttl">보강 일정 제안 도착</div>
              <div class="sub">코치님이 4/24, 4/25 두 날짜를 제안했어요. 1개를 선택해 주세요.</div>
            </div>
            <span class="arrow">›</span>
          </a>
          <a href="6-6-booking-detail.html?status=reschedule_pending" class="alert-card">
            <span class="icon">📅</span>
            <div class="body">
              <div class="ttl">변경 요청 응답 대기 중</div>
              <div class="sub">5/13 (수) 14:00 레슨 변경 요청 — 코치님 응답 대기</div>
            </div>
            <span class="arrow">›</span>
          </a>
        </div>
      </div>

      <!-- ④ 담당 코치 (작은 보조 카드) -->
      <div style="padding:14px 16px 0;">
        <div class="section-title" style="margin-bottom:6px;">담당 코치</div>
        <a href="../flow4-chat/4-2-chat.html" class="coach-pill">
          <div class="ava">🧑‍🏫</div>
          <div class="nm">
            <span class="role">정기 레슨 · 월·수 14:00 · 20분</span>
            김민수 코치님
          </div>
          <span style="color:var(--green);font-size:12px;font-weight:700;flex-shrink:0;">💬 메시지</span>
        </a>
      </div>

      <!-- ⑤ 캘린더 + 선택일 레슨 (둘러보기) -->
      <div style="padding:14px 16px 0;">
        <div class="section-title">📅 캘린더로 둘러보기</div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
          <div id="week-label" style="font-size:13px;font-weight:700;color:var(--navy);"></div>
          <div style="display:flex;gap:4px;">
            <button onclick="moveWeek(-1)" id="wk-prev" style="width:28px;height:28px;border-radius:8px;border:1px solid var(--gray-200);background:#fff;font-size:12px;cursor:pointer;">‹</button>
            <button onclick="moveWeek(1)" style="width:28px;height:28px;border-radius:8px;border:1px solid var(--gray-200);background:#fff;font-size:12px;cursor:pointer;">›</button>
          </div>
        </div>
        <div id="week-grid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px;"></div>
        <div id="lessons-title" style="font-size:11px;color:var(--gray-500);font-weight:600;margin-bottom:6px;"></div>
        <div id="lessons-area"></div>
      </div>

      <!-- 푸터 여백 -->
      <div style="height:20px;"></div>

    </div>

    <!-- 하단 네비 (학생용 SaaS — 검색 → 변경요청으로 교체) -->
    <div style="position:absolute;bottom:20px;left:16px;right:16px;z-index:50;">
      <div style="display:flex;align-items:center;justify-content:space-around;height:60px;background:#fff;border-radius:30px;box-shadow:0 2px 16px rgba(0,0,0,0.1);border:1px solid var(--gray-100);">
        <a href="6-0-schedule-home.html" style="display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;padding:8px 16px;"><span style="font-size:18px;">🏠</span><span style="font-size:9px;font-weight:700;color:var(--green);">홈</span></a>
        <a href="6-5-booking-list.html" style="display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;padding:8px 16px;"><span style="font-size:18px;">📋</span><span style="font-size:9px;font-weight:600;color:var(--gray-400);">내 레슨</span></a>
        <a href="../flow4-chat/4-1-chat-list.html" style="display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;padding:8px 16px;"><span style="font-size:18px;">💬</span><span style="font-size:9px;font-weight:600;color:var(--gray-400);">메시지</span></a>
        <a href="6-2-mypage.html" style="display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;padding:8px 16px;"><span style="font-size:18px;">👤</span><span style="font-size:9px;font-weight:600;color:var(--gray-400);">마이</span></a>
      </div>
    </div>

  </div>
</div>

<script>
const DAY_NAMES = ['일','월','화','수','목','금','토'];
const TODAY = new Date();
TODAY.setHours(0,0,0,0);
// 학생 정기 레슨 mock: 월(1)·수(3) 14:00 20분
const STUDENT_LESSON_DAYS = [1, 3];
const LESSON_TIME = '14:00';
const LESSON_DURATION = 20;
// mock 결제 미수 (실제로는 API)
const HAS_UNPAID = true;
let weekOffset = 0;
let selectedDate = new Date(TODAY); // 기본 선택 = 오늘

function getNextLesson() {
  // 오늘 또는 가장 가까운 정기 레슨 날짜 찾기 (최대 14일 안)
  for (let i = 0; i < 14; i++) {
    const d = new Date(TODAY); d.setDate(TODAY.getDate() + i);
    if (STUDENT_LESSON_DAYS.includes(d.getDay())) return d;
  }
  return null;
}

function renderPaymentArea() {
  const area = document.getElementById('payment-area');
  if (!area) return;
  if (!HAS_UNPAID) { area.innerHTML = ''; return; }
  area.innerHTML = `
    <a href="6-6-booking-detail.html?status=confirmed&payment=unpaid" class="hero-card payment">
      <div class="lead-icon">💳</div>
      <div class="body">
        <div class="label">결제 안내</div>
        <div class="ttl">5월 4주차 미결제</div>
        <div class="sub">결제 후 코치님께 보고해 주세요</div>
      </div>
      <span class="arrow">›</span>
    </a>`;
}

function renderNextLesson() {
  const area = document.getElementById('next-lesson-area');
  if (!area) return;
  const next = getNextLesson();
  if (!next) {
    area.innerHTML = `
      <div class="hero-card">
        <div class="lead-icon">📅</div>
        <div class="body">
          <div class="label">다음 레슨</div>
          <div class="ttl" style="color:var(--gray-400);">예정된 레슨 없음</div>
          <div class="sub">코치님께 연락해 일정을 확인해 주세요</div>
        </div>
      </div>`;
    return;
  }
  const isToday = sameDay(next, TODAY);
  const dow = next.getDay();
  const dayLabel = isToday ? '오늘' : (sameDay(next, addDays(TODAY, 1)) ? '내일' : `${next.getMonth()+1}/${next.getDate()} (${DAY_NAMES[dow]})`);
  area.innerHTML = `
    <a href="6-6-booking-detail.html?status=confirmed" class="hero-card next-lesson">
      <div class="lead-icon">📅</div>
      <div class="body">
        <div class="label">다음 레슨</div>
        <div class="ttl">${dayLabel} ${LESSON_TIME}</div>
        <div class="sub">정기 레슨 · ${LESSON_DURATION}분 · 김민수 코치</div>
      </div>
      <span class="arrow">›</span>
    </a>`;
}

function addDays(d, n) {
  const x = new Date(d); x.setDate(d.getDate() + n); return x;
}

function getWeekStart() {
  // 오늘이 포함된 주의 일요일
  const s = new Date(TODAY);
  s.setDate(TODAY.getDate() - TODAY.getDay() + weekOffset * 7);
  return s;
}

function sameDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}

function renderWeek() {
  const start = getWeekStart();
  const end = new Date(start); end.setDate(start.getDate() + 6);
  document.getElementById('week-label').textContent =
    `${start.getMonth()+1}/${start.getDate()} ~ ${end.getMonth()+1}/${end.getDate()}`;
  const prev = document.getElementById('wk-prev');
  prev.style.opacity = weekOffset <= -4 ? '0.35' : '1';
  prev.disabled = weekOffset <= -4;
  const grid = document.getElementById('week-grid');
  grid.innerHTML = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const dow = d.getDay();
    const isToday = sameDay(d, TODAY);
    const isSelected = sameDay(d, selectedDate);
    const hasLesson = STUDENT_LESSON_DAYS.includes(dow);
    const cell = document.createElement('div');
    let cls = 'cal-cell';
    if (isToday) cls += ' today';
    else if (hasLesson) cls += ' has-lesson';
    if (isSelected) cls += ' selected';
    cell.className = cls;
    cell.innerHTML = `
      <div class="dow">${DAY_NAMES[dow]}</div>
      <div class="num">${d.getDate()}</div>
      ${hasLesson ? '<div class="dot"></div>' : '<div style="height:7px;"></div>'}
    `;
    // 모든 날짜 클릭 가능 (오늘 포함)
    const dateCopy = new Date(d);
    cell.addEventListener('click', () => selectDate(dateCopy));
    grid.appendChild(cell);
  }
  renderLessons();
}

function selectDate(d) {
  selectedDate = new Date(d);
  selectedDate.setHours(0,0,0,0);
  renderWeek();
}

function renderLessons() {
  const titleEl = document.getElementById('lessons-title');
  const area = document.getElementById('lessons-area');
  if (!titleEl || !area) return;
  const dow = selectedDate.getDay();
  const hasLesson = STUDENT_LESSON_DAYS.includes(dow);
  const dateLabel = `${selectedDate.getMonth()+1}/${selectedDate.getDate()} (${DAY_NAMES[dow]})`;
  titleEl.textContent = `${dateLabel} 레슨`;

  if (hasLesson) {
    area.innerHTML = `
      <a href="6-6-booking-detail.html?status=confirmed" class="lesson-card">
        <div class="lesson-time">
          <div class="hh">${LESSON_TIME}</div>
          <div class="ampm">${DAY_NAMES[dow]}요일</div>
        </div>
        <div class="lesson-info">
          <div class="title">정기 레슨 · 김민수 코치 <span class="badge-sm b-scheduled">예정</span></div>
          <div class="meta">${LESSON_DURATION}분 · 1:1 개인 · ${dateLabel}</div>
        </div>
      </a>`;
  } else {
    area.innerHTML = `
      <div style="padding:14px;text-align:center;background:#fff;border:1px dashed var(--gray-200);border-radius:12px;color:var(--gray-400);font-size:12px;">
        이 날에는 정기 레슨이 없어요
      </div>`;
  }
}

function moveWeek(dir) {
  weekOffset += dir;
  if (weekOffset < -4) weekOffset = -4;
  if (weekOffset > 8) weekOffset = 8;
  renderWeek();
}

function renderAlertCount() {
  const cnt = document.querySelectorAll('#alerts-area .alert-card').length;
  const label = document.getElementById('alert-count');
  const wrap = document.getElementById('alerts-wrap');
  if (label) label.textContent = cnt > 0 ? `${cnt}건` : '';
  if (wrap) wrap.style.display = cnt > 0 ? 'block' : 'none';
}

// 초기 렌더
renderPaymentArea();
renderNextLesson();
renderAlertCount();
renderWeek();
</script>
</body>
</html>
